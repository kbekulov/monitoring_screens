services:
  monitoring-postgres:
    image: postgres:17-alpine
    container_name: monitoring-screens-postgres
    environment:
      POSTGRES_DB: monitoring_screens
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring_dev_password
    ports:
      - "5432:5432"
    volumes:
      - monitoring-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring_screens"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  monitoring-postgres-data:
